; driver-vedirect — VE.Direct device configuration
; ====================================================
; This file ships with the package and contains every available setting
; with a safe default. DO NOT EDIT — create a config.ini instead and
; override only what you need. config.ini is gitignored and local to
; each install.

[mqtt]
host = localhost
port = 1883
; username =
; password =
client_id = driver-vedirect
reconnect_min_delay = 1.0
reconnect_max_delay = 30.0

[device]
id = vedirect
baud = 19200

[serial]
; Ports are found by scanning by_id_dir for names matching any of port_globs (comma-separated
; fnmatch patterns) and are identified by what they report (PID, SER#), never by port order.
; Narrow the globs when other USB serial adapters share the by-id directory.
by_id_dir = /dev/serial/by-id
port_globs = usb-Duppa_srl_*, usb-VictronEnergy_*, usb-FTDI_*
; A port that fails to open or read is retried after backoff_min_s, doubling to backoff_max_s.
backoff_min_s = 1.0
backoff_max_s = 30.0
